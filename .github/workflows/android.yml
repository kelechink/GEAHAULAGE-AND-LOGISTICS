name: Android driver app

on:
  push:
    branches: [main, master, "claude/**"]
    paths: ["android-driver/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android-driver/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME), so settings.gradle.kts includes :app here.
      - name: Unit tests (core)
        run: ./gradlew :core:test --no-daemon
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gea-driver-debug
          path: android-driver/app/build/outputs/apk/debug/*.apk
